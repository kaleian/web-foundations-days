
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Toolkit</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1>Notes Toolkit</h1>
        <p>Write your thoughts and save your draft automatically.</p>
      </div>

      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <section class="note-card">
      <label for="note-text">Your note</label>

      <textarea
        id="note-text"
        rows="10"
        placeholder="Start writing your note..."
      ></textarea>

      <div class="counter-row">
        <p id="char-count" aria-live="polite">0 / 200 characters</p>
        <p id="word-count" aria-live="polite">0 words</p>
      </div>

      <button id="clear-btn" type="button" class="clear-button">
        Clear note
      </button>
    </section>
  </main>
</body>
</html>
